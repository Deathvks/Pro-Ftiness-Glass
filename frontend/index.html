<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta http-equiv="Content-Security-Policy" content="
      default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: content: blob:;
      style-src * 'self' 'unsafe-inline';
      script-src * 'self' 'unsafe-inline' 'unsafe-eval' blob:;
      worker-src * 'self' blob:;
      img-src * 'self' data: blob:;
      media-src * 'self' data: blob:;
      frame-src * 'self' data: blob:;
      connect-src * 'self' 'unsafe-inline';
    " />

  <title>Pro Fitness Glass - Tu App de Fitness</title>
  <meta name="description"
    content="Registra tus entrenamientos, sigue tu progreso nutricional y alcanza tus objetivos de fitness con Pro Fitness Glass." />
  <meta name="keywords"
    content="fitness, gym, entrenamiento, nutrición, rutinas, pesas, calorías, macros, salud, deporte, tracker" />
  <link rel="canonical" href="https://pro-fitness-glass.zeabur.app/" />

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <meta name="theme-color" content="#0f172a" id="dynamic-theme-color" />
  <meta name="color-scheme" content="dark light" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="icon" type="image/png" href="/favicon-32x32.png?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="manifest" href="/manifest.json?v=2" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Pro Fitness" />

  <link rel="preconnect" href="https://accounts.google.com" crossorigin />
  <link rel="dns-prefetch" href="https://accounts.google.com" />

  <meta name="google-site-verification" content="ARC8lM_i6d5sVoiyNVFvw28qpbyy-Xr7xI5eZBHmaSo" />

  <style>
    :root {
      --accent-r: 34;
      --accent-g: 197;
      --accent-b: 94;
      --glass-base: 26, 35, 53;
      --glass-opacity: 0.65;
      --glass-border-opacity: 0.2;
      --glass-blur: 24px;
      --glass-radius: 28px;
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      --bg-color: #0f172a;
    }

    html.light-theme {
      --glass-base: 255, 255, 255;
      --glass-opacity: 0.6;
      --glass-border-opacity: 0.5;
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
      --bg-color: #f8fafc;
    }

    html.dark-theme {
      --glass-base: 30, 41, 59;
      --glass-opacity: 0.55;
      --glass-border-opacity: 0.2;
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --bg-color: #0f172a;
    }

    html.oled-theme {
      --glass-base: 15, 15, 15;
      --glass-opacity: 0.7;
      --glass-border-opacity: 0.3;
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      --bg-color: #000000;
    }

    html.galaxy-theme {
      --glass-base: 8, 8, 20;
      --glass-opacity: 0.15;
      --glass-border-opacity: 0.2;
      --glass-blur: 2px;
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --bg-color: #080814;
    }

    html.desert-theme {
      --bg-color: #fff1e6;
    }
    html.dark.desert-theme {
      --bg-color: #3d2b1f;
    }

    html.ocean-theme {
      --bg-color: #e0f2fe;
    }
    html.dark.ocean-theme {
      --bg-color: #0f172a;
    }

    /* =========================================================
       BLINDAJE PWA iOS: Eliminar borde superior y margen píldora
       ========================================================= */
    html {
      background-color: var(--bg-color);
      height: 100dvh !important;
      width: 100vw !important;
      overflow: hidden !important;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100dvh !important;
      width: 100vw !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      overflow: hidden !important;
      overscroll-behavior: none;
    }

    #root {
      height: 100dvh !important;
      width: 100vw !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      overflow: hidden !important;
    }

    /* En standalone mode, 100dvh puede causar un espacio fantasma inferior en iOS 27 beta
       porque excluye el área segura. 100vh garantiza pantalla completa física. */
    @media (display-mode: standalone) {
      html, body, #root {
        height: 100vh !important;
      }
    }

    /* ========================================================= */

    .app-splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: transparent;
      color: #ffffff;
      opacity: 1;
      transition: opacity 0.3s ease;
      padding-bottom: 20px;
      padding-top: calc(env(safe-area-inset-top) + 2rem);
      box-sizing: border-box;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }

    .app-splash-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.1);
      border-radius: 50%;
      border-top-color: rgb(var(--accent-r), var(--accent-g), var(--accent-b));
      animation: spin 1s ease-in-out infinite;
      box-shadow: 0 0 20px -5px rgb(var(--accent-r), var(--accent-g), var(--accent-b));
      margin-top: 2rem;
    }

    html.light-theme .app-splash-screen {
      color: #0f172a;
    }

    html.light-theme .app-splash-spinner {
      border-color: rgba(0, 0, 0, 0.05);
      border-top-color: rgb(var(--accent-r), var(--accent-g), var(--accent-b));
    }

    html.galaxy-theme .app-splash-spinner {
      border-color: rgba(168, 85, 247, 0.1);
      border-top-color: #a855f7;
      border-right-color: #3b82f6;
      box-shadow: 0 0 20px -5px #a855f7;
    }

    html.galaxy-theme .app-splash-title .title-text {
      background: linear-gradient(to right, #a855f7, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    html.galaxy-theme .app-splash-title span.glass-badge {
      border-color: rgba(168, 85, 247, 0.3);
      -webkit-text-fill-color: #a855f7;
      background-image: linear-gradient(rgba(168, 85, 247, 0.1), rgba(168, 85, 247, 0.1)), linear-gradient(rgba(8, 8, 20, 0.5), rgba(8, 8, 20, 0.5));
    }

    html.desert-theme .app-splash-screen {
      color: #5c4033;
      background-color: #fff1e6 !important;
      background-image: url('/assets/themes/desert.jpg') !important;
      background-size: cover !important;
      background-position: center !important;
    }
    html.dark.desert-theme .app-splash-screen {
      color: #f5deb3;
      background-color: #3d2b1f !important;
      background-image: linear-gradient(rgba(61, 43, 31, 0.7), rgba(61, 43, 31, 0.7)), url('/assets/themes/desert.jpg') !important;
      background-size: cover !important;
      background-position: center !important;
    }

    html.desert-theme .app-splash-spinner {
      border-color: rgba(205, 133, 63, 0.1);
      border-top-color: #cd853f;
      box-shadow: 0 0 20px -5px #cd853f;
    }
    html.dark.desert-theme .app-splash-spinner {
      border-color: rgba(210, 180, 140, 0.1);
      border-top-color: #d2b48c;
      box-shadow: 0 0 20px -5px #d2b48c;
    }

    html.desert-theme .app-splash-title span.glass-badge {
      border-color: rgba(205, 133, 63, 0.3);
      -webkit-text-fill-color: #cd853f;
      background-image: linear-gradient(rgba(205, 133, 63, 0.1), rgba(205, 133, 63, 0.1)), linear-gradient(rgba(255, 241, 230, 0.5), rgba(255, 241, 230, 0.5));
    }
    html.dark.desert-theme .app-splash-title span.glass-badge {
      border-color: rgba(210, 180, 140, 0.3);
      -webkit-text-fill-color: #d2b48c;
      background-image: linear-gradient(rgba(210, 180, 140, 0.1), rgba(210, 180, 140, 0.1)), linear-gradient(rgba(44, 30, 22, 0.5), rgba(44, 30, 22, 0.5));
    }

    .app-splash-title {
      font-size: 2.5rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.2;
      letter-spacing: -0.02em;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      animation: fadeUp 0.8s ease-out forwards;
      opacity: 0;
    }

    .app-splash-title span.glass-badge {
      display: inline-block;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 0.5rem 1.5rem;
      border-radius: var(--glass-radius);
      background-image:
        linear-gradient(rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.10), rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.10)),
        linear-gradient(rgba(var(--glass-base), var(--glass-opacity)), rgba(var(--glass-base), var(--glass-opacity)));
      border: 1px solid rgba(var(--accent-r), var(--accent-g), var(--accent-b), var(--glass-border-opacity));
      border-top-color: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      box-shadow: var(--glass-shadow);
      color: rgb(var(--accent-r), var(--accent-g), var(--accent-b));
      text-transform: uppercase;
    }

    .app-splash-footer {
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      opacity: 0.7;
      pointer-events: auto;
    }

    .app-splash-footer nav {
      margin-bottom: 8px;
    }

    .app-splash-footer a {
      color: inherit;
      text-decoration: none;
      font-weight: 600;
      margin: 0 8px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .app-splash-footer a:hover {
      border-bottom-color: currentColor;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <script>
    (function () {
      try {
        var accentMap = {
          'green': '#22c55e', 'blue': '#3b82f6', 'violet': '#8b5cf6', 'amber': '#f59e0b',
          'rose': '#f43f5e', 'teal': '#14b8a6', 'cyan': '#06b6d4', 'orange': '#f97316',
          'lime': '#84cc16', 'fuchsia': '#d946ef', 'emerald': '#10b981', 'indigo': '#6366f1',
          'purple': '#a855f7', 'pink': '#ec4899', 'red': '#ef4444', 'yellow': '#eab308',
          'sky': '#0ea5e9', 'slate': '#64748b', 'zinc': '#71717a', 'stone': '#78716c',
          'neutral': '#737373'
        };

        var savedTheme = localStorage.getItem('theme') || 'system';
        if (savedTheme.startsWith('"') && savedTheme.endsWith('"')) savedTheme = savedTheme.slice(1, -1);
        var savedAccentKey = localStorage.getItem('accent') || 'green';
        var savedDarkMode = localStorage.getItem('darkMode');
        if (savedDarkMode && savedDarkMode.startsWith('"') && savedDarkMode.endsWith('"')) savedDarkMode = savedDarkMode.slice(1, -1);
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        var isDark = systemDark;
        if (savedDarkMode === 'true') isDark = true;
        if (savedDarkMode === 'false') isDark = false;

        if (savedAccentKey.startsWith('"') && savedAccentKey.endsWith('"')) {
          savedAccentKey = savedAccentKey.slice(1, -1);
        }

        var effectiveTheme = savedTheme;
        if (effectiveTheme === 'system') effectiveTheme = isDark ? 'dark' : 'light';

        var hexColor = accentMap[savedAccentKey] || savedAccentKey;
        if (!/^#[0-9A-F]{6}$/i.test(hexColor)) hexColor = '#22c55e';

        if (effectiveTheme === 'ocean' || effectiveTheme === 'ocean-dark') {
          hexColor = '#0ea5e9';
        }

        function hexToRgb(hex) {
          var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
          return result ? {
            r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16)
          } : { r: 34, g: 197, b: 94 };
        }

        var rgb = hexToRgb(hexColor);
        var root = document.documentElement;
        root.style.setProperty('--app-accent', hexColor);
        root.style.setProperty('--accent-r', rgb.r);
        root.style.setProperty('--accent-g', rgb.g);
        root.style.setProperty('--accent-b', rgb.b);

        var bgColors = { light: '#f8fafc', dark: '#0f172a', oled: '#000000', galaxy: '#080814', desert: '#f0dec5', 'desert-dark': '#2c1e16', ocean: '#e0f2fe', 'ocean-dark': '#0f172a' };
        var headerColors = { light: '#f8fafc', dark: '#0f172a', oled: '#000000', galaxy: '#080814', desert: '#f0dec5', 'desert-dark': '#2c1e16', ocean: '#e0f2fe', 'ocean-dark': '#0f172a' };

        var selectedBgColor = bgColors[effectiveTheme] || bgColors.dark;
        var selectedHeaderColor = headerColors[effectiveTheme] || headerColors.dark;

        root.classList.remove('light-theme', 'dark-theme', 'oled-theme', 'galaxy-theme', 'desert-theme', 'dark');
        if (savedTheme === 'system') {
          root.classList.add(isDark ? 'dark-theme' : 'light-theme');
        } else {
          var baseTheme = effectiveTheme;
          if (baseTheme === 'desert-dark') baseTheme = 'desert';
          if (baseTheme === 'ocean-dark') baseTheme = 'ocean';
          root.classList.add(baseTheme + '-theme');
          if (effectiveTheme === 'desert-dark' || effectiveTheme === 'ocean-dark') {
            root.classList.add('dark');
          }
        }

        var metaColor = document.getElementById('dynamic-theme-color');
        if (metaColor) {
          var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          // Safari in iOS automatically applies a translucent blur based on the background image 
          // if theme-color is NOT present. For Android, we keep the solid color to tint Chrome.
          if (isIOS || window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
            metaColor.remove();
          } else {
            metaColor.setAttribute('content', selectedHeaderColor);
          }
        }

        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        root.style.setProperty('--bg-color', selectedHeaderColor);

        var splash = document.querySelector('.app-splash-screen');
        if (splash) {
          splash.style.backgroundColor = selectedBgColor;
        }

        // iOS PWA viewport recalculation hack:
        // iOS doesn't compute env(safe-area-inset-top) correctly on first PWA standalone load.
        // A tiny height toggle forces WebKit to recalculate the viewport + safe areas.
        // This replicates the effect of the iOS "back gesture" that the user noticed fixes the issue.
        if (isStandalone) {
          requestAnimationFrame(function () {
            root.style.height = '100.1vh';
            requestAnimationFrame(function () {
              root.style.height = '100vh';
            });
          });
        }

      } catch (e) {
        console.error('Splash init error', e);
      }
    })();
  </script>
</head>

<body>
  <div id="root">
    <div class="app-splash-screen">

      <div class="splash-content">
        <div class="app-splash-title">
          <span class="title-text">PRO FITNESS</span>
          <span class="glass-badge">GLASS</span>
        </div>
        <div class="app-splash-spinner"></div>
      </div>

      <footer class="app-splash-footer">
        <nav>
          <a href="https://pro-fitness-glass.zeabur.app/privacy">Política de Privacidad</a>
          <span style="opacity: 0.4; margin: 0 5px;">|</span>
          <a href="https://pro-fitness-glass.zeabur.app/terms">Términos del Servicio</a>
        </nav>
        <div style="margin-top: 8px; opacity: 0.5; font-size: 0.9em;">
          © 2026 Pro Fitness Glass
        </div>
      </footer>

    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
